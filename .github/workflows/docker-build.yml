name: Build and Push Docker Images

# Запуск при пуше в ветку main (или любую другую, которую вы укажете)
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Определяем два сервиса: backend и frontend
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          # Контекст — корень репозитория, чтобы были доступны общие файлы
          context: .
          # Путь к Dockerfile относительно корня (./backend/Dockerfile или ./frontend/Dockerfile)
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          # Теги: latest и короткий SHA коммита для версионирования
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest,${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          # Кэширование слоёв для ускорения сборки
          cache-from: type=gha
          cache-to: type=gha,mode=max