name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-to-render:
    needs: build-and-push
    if: success()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            hook_url_secret: RENDER_BACKEND_DEPLOY_HOOK_URL
          - service: frontend
            hook_url_secret: RENDER_FRONTEND_DEPLOY_HOOK_URL
      fail-fast: false
    
    steps:
      - name: Trigger Render deploy for ${{ matrix.service }}
        run: |
          echo "Triggering deployment for ${{ matrix.service }}..."
          curl -X POST "${{ secrets[matrix.hook_url_secret] }}"
          echo "Deploy triggered successfully!"